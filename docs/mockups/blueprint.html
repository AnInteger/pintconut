<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选图纸 · Pintcount 原型</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <a class="back" href="index.html">← 返回索引</a>
  <div class="cap"><span>选图纸</span> · 解析成功（含备豆统计 / 选色盘）· 核心流</div>

  <div class="phone">
    <div class="status"><span class="t">9:41</span><span class="bat"><i><b></b></i></span></div>

    <div class="nav">
      <div class="left"><div class="chev"></div><div class="title">图纸</div></div>
      <div class="action">换一张</div>
    </div>

    <div style="padding:8px 20px 0">
      <!-- 已解析图纸：马赛克大图 + 尺寸徽章 -->
      <div class="b1" style="height:240px;border-radius:var(--r-card);position:relative;margin-bottom:14px">
        <div class="badge lat" style="position:absolute;left:12px;bottom:12px;background:var(--ink)">29 × 29</div>
      </div>

      <div class="row-between" style="margin-bottom:14px">
        <span style="font-size:var(--fs-body);font-weight:800"><span class="lat">8</span> 种颜色</span>
        <span class="muted" style="font-size:var(--fs-caption)">来自小红书截图</span>
      </div>

      <!-- 可选色盘 -->
      <div class="section-label" style="margin-bottom:10px">色盘</div>
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <span class="pill" style="background:var(--grad-brand)">Perler ✓</span>
        <span class="pill" style="background:var(--chip);color:var(--muted)">Hama</span>
        <span class="pill" style="background:var(--chip);color:var(--muted)">Artkal</span>
      </div>

      <!-- 备豆统计 -->
      <div class="section-label" style="margin-bottom:10px">需要备豆</div>
      <div class="soft-panel" style="margin-bottom:22px">
        <div class="row"><span class="bead sm" style="background:var(--err-color)"></span><span style="flex:1;font-size:var(--fs-body);font-weight:700">草莓红</span><span class="lat" style="font-size:var(--fs-body);font-weight:800">×42</span></div>
        <div class="row"><span class="bead sm" style="background:#F0EAF6;box-shadow:inset 0 0 0 1.5px var(--line), inset 2px 2px 3px rgba(255,255,255,.6)"></span><span style="flex:1;font-size:var(--fs-body);font-weight:700">奶白</span><span class="lat" style="font-size:var(--fs-body);font-weight:800">×180</span></div>
        <div class="row"><span class="bead sm" style="background:var(--brand-a)"></span><span style="flex:1;font-size:var(--fs-body);font-weight:700">深紫</span><span class="lat" style="font-size:var(--fs-body);font-weight:800">×35</span></div>
        <div class="row"><span class="bead sm" style="background:var(--success)"></span><span style="flex:1;font-size:var(--fs-body);font-weight:700">叶绿</span><span class="lat" style="font-size:var(--fs-body);font-weight:800">×28</span></div>
        <div class="row muted" style="font-size:var(--fs-caption)">…… 共 <span class="lat">8</span> 种 · <span class="lat">841</span> 颗</div>
      </div>

    </div>

    <div style="height:16px"></div>
    <div class="screen-footer">
      <a class="btn btn-primary" href="capture.html" style="text-decoration:none">用这张图纸去拍照<span class="arrow">→</span></a>
    </div>
    <div class="home-bar"></div>
  </div>
</div>
</body>
</html>
