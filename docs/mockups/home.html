<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页 · Pintcount 原型</title>
<link rel="stylesheet" href="styles.css">
<style>
  .hero { position: relative; padding: 6px 20px 4px; overflow: hidden; }
  .hero-glow { position: absolute; top: -70px; right: -50px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, rgba(236,72,153,.30), rgba(124,58,237,.12) 55%, transparent 72%); pointer-events: none; }
  .hero .lockup { position: relative; margin: 6px 0 26px; }
  .hero-title { position: relative; font-size: var(--fs-display); font-weight: 900; line-height: 1.1; letter-spacing: -.6px; }
  .hero-sub { position: relative; font-size: var(--fs-body); font-weight: 600; color: var(--muted); margin: 12px 0 18px; line-height: 1.5; }
  .bead-row { position: relative; display: flex; gap: 8px; margin-bottom: 22px; }
  .bead-row span { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.10); }
  .hero .btn { position: relative; }
</style>
</head>
<body>
<div class="stage">
  <a class="back" href="index.html">← 返回索引</a>
  <div class="cap"><span>首页</span> · 核心流</div>

  <div class="phone">
    <div class="status"><span class="t">9:41</span><span class="bat"><i><b></b></i></span></div>

    <div class="hero">
      <div class="hero-glow"></div>
      <div class="lockup">
        <div class="brand-mark"></div><b>Pintcount</b>
      </div>

      <div class="hero-title">拼豆质检</div>
      <div class="hero-sub">熨烫之前，拍一张对照图纸，标出错豆。</div>

      <div class="bead-row">
        <span style="background:#EC4899"></span><span style="background:#7C3AED"></span><span style="background:#F59E0B"></span><span style="background:#10B981"></span><span style="background:#38BDF8"></span>
      </div>

      <a class="btn btn-primary" href="blueprint.html">Count<span class="chev-r"></span></a>
    </div>

    <div style="padding:0 20px">
      <div class="row-between" style="margin:30px 0 14px">
        <span class="section-label">最近作品</span>
        <a href="gallery.html" style="font-size:var(--fs-label);font-weight:800;color:var(--brand-a);text-decoration:none">全部</a>
      </div>
    </div>

    <div style="overflow:hidden">
      <div style="display:flex;gap:12px;padding:0 20px 6px;width:max-content">
        <a href="gallery-detail.html" style="width:150px;flex-shrink:0;text-decoration:none;color:inherit">
          <div class="b1" style="height:150px;border-radius:18px;position:relative">
            <div style="position:absolute;left:10px;bottom:10px" class="badge badge-err">4 错</div>
          </div>
          <div style="font-size:12px;font-weight:700;margin-top:8px">草莓熊 · 29×29</div>
          <div style="font-size:11px;color:var(--muted)">昨天</div>
        </a>
        <a href="gallery-detail.html" style="width:150px;flex-shrink:0;text-decoration:none;color:inherit">
          <div class="b2" style="height:150px;border-radius:18px;position:relative">
            <div style="position:absolute;left:10px;bottom:10px" class="badge badge-ok">通过</div>
          </div>
          <div style="font-size:12px;font-weight:700;margin-top:8px">向日葵 · 20×20</div>
          <div style="font-size:11px;color:var(--muted)">3 天前</div>
        </a>
        <a href="gallery-detail.html" style="width:150px;flex-shrink:0;text-decoration:none;color:inherit">
          <div class="b3" style="height:150px;border-radius:18px;position:relative">
            <div style="position:absolute;left:10px;bottom:10px" class="badge badge-err">1 错</div>
          </div>
          <div style="font-size:12px;font-weight:700;margin-top:8px">海浪 · 29×29</div>
          <div style="font-size:11px;color:var(--muted)">上周</div>
        </a>
        <div style="width:40px;flex-shrink:0"></div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab on"><div class="ic ic-home"></div><div class="lb">首页</div></div>
      <a class="tab" href="gallery.html" style="text-decoration:none"><div class="ic ic-gallery"><span></span><span></span><span></span><span></span></div><div class="lb">作品库</div></a>
      <a class="tab" href="settings.html" style="text-decoration:none"><div class="ic ic-settings"></div><div class="lb">设置</div></a>
    </div>
    <div class="home-bar"></div>
  </div>
</div>
</body>
</html>
