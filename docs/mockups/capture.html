<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照 · Pintcount 原型</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 取景器专属 */
  .vf { position: relative; flex: 1; background: radial-gradient(circle at 50% 38%, #3A2F5A 0%, #221A3A 60%, #150F26 100%); overflow: hidden; }
  .vf .board { position: absolute; inset: 70px 30px; border-radius: 10px; opacity: .92; }
  .grid-line { position: absolute; background: rgba(255,255,255,.15); pointer-events: none; }
  .grid-line.v { top: 0; bottom: 0; width: 1px; }
  .grid-line.h { left: 0; right: 0; height: 1px; }
  .scan { position: absolute; left: 30px; right: 30px; top: 70px; height: 3px; background: linear-gradient(90deg, transparent, var(--brand-b) 50%, transparent); box-shadow: 0 0 16px 3px rgba(236,72,153,.45); animation: cap-scan 2.6s ease-in-out infinite; }
  @keyframes cap-scan { 0%,100% { transform: translateY(0) } 50% { transform: translateY(540px) } }
  .corner { position: absolute; width: 30px; height: 30px; border: 4px solid var(--brand-b); }
  .corner.tl { top: 60px; left: 20px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .corner.tr { top: 60px; right: 20px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
  .corner.bl { bottom: 60px; left: 20px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
  .corner.br { bottom: 60px; right: 20px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
  .locked { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(124,58,237,.92); color:#fff; font-size:12px; font-weight:800; padding:6px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; }
  .locked::before { content:''; width:6px; height:6px; border-radius:50%; background:#fff; }
  .vf-hint { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.62); font-size: 12px; font-weight: 600; }
  /* 底栏：grid 1fr auto 1fr 保证快门严格居中（修“歪了”） */
  .cam-bar { background: #150F26; padding: 20px 24px 26px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .cam-side { color: rgba(255,255,255,.92); font-size: 13px; font-weight: 700; }
  .cam-side.left { justify-self: start; }
  .cam-side.right { justify-self: end; }
  .shutter { width: 74px; height: 74px; border-radius: 50%; background: var(--grad-brand); border: 5px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); display: block; }
</style>
</head>
<body>
<div class="stage">
  <a class="back" href="index.html">← 返回索引</a>
  <div class="cap"><span>拍照</span> · 自动锁定拼板 · 核心流</div>

  <div class="phone">
    <div class="status" style="color:#fff"><span class="t">9:41</span><span class="bat"><i style="border-color:#fff"><b style="background:#fff"></b></i></span></div>

    <div class="vf">
      <div class="board beads"></div>
      <div class="grid-line v" style="left:33.333%"></div>
      <div class="grid-line v" style="left:66.666%"></div>
      <div class="grid-line h" style="top:33.333%"></div>
      <div class="grid-line h" style="top:66.666%"></div>
      <div class="scan"></div>
      <div class="locked">已锁定拼板</div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="vf-hint">把整块拼板完整拍进来</div>
    </div>

    <div class="cam-bar">
      <span class="cam-side left">从相册选</span>
      <a href="processing.html" class="shutter"></a>
      <span class="cam-side right">翻转</span>
    </div>
    <div class="home-bar" style="background:#150F26"></div>
  </div>
</div>
</body>
</html>
