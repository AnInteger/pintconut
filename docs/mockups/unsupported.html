<!doctype html>
<html lang="zh">
<head>

<link rel="stylesheet" href="styles.css">
<style>
  .info-card { background: var(--bg-soft); border-radius: var(--r-card); padding: 24px 20px; text-align: center; }
  .info-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--chip); margin: 0 auto 16px; display:flex;align-items:center;justify-content:center;color:var(--brand-a);font-weight:800; }
</style>
</head>
<body>
<div class="stage">
  <a class="back" href="index.html">← 返回索引</a>
  <div class="cap"><span>不支持场景</span> · 明确提示，无逃生舱 · 边界</div>

  <div class="phone">
    <div class="status"><span class="t">9:41</span><span class="bat"><i><b></b></i></span></div>

    <div class="nav">
      <div class="left"><div class="chev"></div><div class="title">图纸</div></div>
    </div>

    <div style="padding:20px 20px 0">
      <div class="info-card">
        <div class="info-ic">?</div>
        <div style="font-size:var(--fs-h1);font-weight:800;line-height:1.3">这类图纸<br>暂不支持</div>

      </div>

      <a class="btn btn-primary" href="blueprint.html" style="margin-top:22px;text-decoration:none">换一张图纸</a>

    <div class="home-bar" style="margin-top:auto"></div>
  </div>
